<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirma tu cuenta en Webding</title>
  </head>
  <body style="margin:0;background:#FAF7F2;color:#1E1E1E;font-family:Inter,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#FAF7F2;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#FFFFFF;border:1px solid rgba(30,30,30,.1);border-radius:28px;overflow:hidden;">
            <tr>
              <td style="padding:36px 30px;text-align:center;">
                <p style="margin:0 0 14px;color:#C89B5B;font-size:12px;font-weight:800;letter-spacing:4px;text-transform:uppercase;">Bienvenido a Webding</p>
                <h1 style="margin:0;font-size:38px;line-height:1.05;">Confirma tu cuenta</h1>
                <p style="margin:18px 0 0;color:rgba(30,30,30,.68);font-size:16px;line-height:1.7;">Estas a un paso de crear invitaciones digitales elegantes, compartirlas y recibir confirmaciones RSVP en tiempo real.</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:0 30px 38px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1E1E1E;color:#FFFFFF;text-decoration:none;border-radius:999px;padding:15px 26px;font-weight:800;">Confirmar mi cuenta</a>
                <p style="margin:18px 0 0;color:rgba(30,30,30,.55);font-size:12px;line-height:1.6;">Si el boton no funciona, abre este enlace:<br /><span style="word-break:break-all;">{{ .ConfirmationURL }}</span></p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
